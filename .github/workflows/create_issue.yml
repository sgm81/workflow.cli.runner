name: Hello World Issue

on:
  workflow_call:

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Create Hello World issue
        run: |
          gh issue create \
            --title "Hello World" \
            --body "Hello World 🚀"
        env:
          GH_TOKEN: ${{ github.token }}
